name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix Android XML Namespace
        run: |
          sed -i -E 's/ (allowBackup|label|supportsRtl|theme|name|exported|screenOrientation|id|layout_width|layout_height|background|orientation|padding|fontFamily|lineSpacingExtra|textColor|textSize|layout_marginTop|layout_marginBottom|text|layout_weight)=/ android:\1=/g' app/src/main/AndroidManifest.xml app/src/main/res/layout/activity_recovery.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SystemRecovery-APK
          path: app/build/outputs/apk/debug/app-debug.apk
