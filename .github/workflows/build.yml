name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore Valid XML Files
        run: |
          mkdir -p app/src/main/res/layout
          echo " category android:name="android.intent.category.LAUNCHER" />" > /dev/null
          python3 -c '
          import base64
          m = ""
          l = ""
          open("app/src/main/AndroidManifest.xml", "wb").write(base64.b64decode(m))
          open("app/src/main/res/layout/activity_recovery.xml", "wb").write(base64.b64decode(l))
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SystemRecovery-APK
          path: app/build/outputs/apk/debug/app-debug.apk
