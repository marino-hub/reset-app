name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Clean XML Files
        run: |
          mkdir -p app/src/main/res/layout
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <application
                  android:allowBackup="false"
                  android:label="System Recovery"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_recovery.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://android.com"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000"
              android:orientation="vertical"
              android:padding="12dp">
              <TextView
                  android:id="@+id/tvHeader"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:fontFamily="monospace"
                  android:lineSpacingExtra="2dp"
                  android:textColor="#E5C07B"
                  android:textSize="13sp" />
              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:layout_marginBottom="8dp"
                  android:fontFamily="monospace"
                  android:text="Use volume up/down and power.\n----------------------------------------"
                  android:textColor="#61AFEF"
                  android:textSize="12sp" />
              <TextView
                  android:id="@+id/tvMenu"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:fontFamily="monospace"
                  android:lineSpacingExtra="4dp"
                  android:textColor="#FFFFFF"
                  android:textSize="14sp" />
              <ScrollView
                  android:id="@+id/scrollLogs"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_marginTop="16dp"
                  android:layout_weight="1">
                  <TextView
                      android:id="@+id/tvLogs"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:fontFamily="monospace"
                      android:lineSpacingExtra="2dp"
                      android:textColor="#CCCCCC"
                      android:textSize="12sp" />
              </ScrollView>
          </LinearLayout>
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SystemRecovery-APK
          path: app/build/outputs/apk/debug/app-debug.apk
